name = "RequestProject"
defaultTargets = ["RequestProject", "Gate04Root", "Gate1A", "Gate1B", "UniversalV8", "Universal"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "Gate04Root"
globs = ["Gate04Root.+"]

[[lean_lib]]
name = "Gate1A"
globs = ["Gate1A.+"]

[[lean_lib]]
name = "Gate1B"
globs = ["Gate1B.+"]

[[lean_lib]]
name = "UniversalV8"
globs = ["UniversalV8.+"]

[[lean_lib]]
name = "Universal"
globs = ["Universal.+"]
